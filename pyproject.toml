[project]
name = "drone-vision"
version = "0.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require local socket bind/network behavior",
]
