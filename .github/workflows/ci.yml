name: CI

on:
  push:
  pull_request:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  TZ: "UTC"

jobs:
  build-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/webapp/package-lock.json

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install -r requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install -r src/backend/requirements.txt

      - name: Install webapp dependencies
        run: npm --prefix src/webapp ci

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

      # cmake and g++ ship with the ubuntu-latest runner image
      # (build-essential is part of the default GitHub Actions Ubuntu
      # toolset). Skipping `apt-get update` avoids hangs when an upstream
      # mirror (e.g. azure.archive.ubuntu.com) is unreachable — a
      # 90-minute mirror retry was the trigger for adding this comment.
      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: C++ unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Python tests
        env:
          REQUIRE_UDP_BIND_TESTS: "1"
          REQUIRE_TCP_BIND_TESTS: "1"
        run: pytest -q

      - name: Webapp tests
        run: npm --prefix src/webapp run test

      - name: Webapp build
        run: npm --prefix src/webapp run build
